<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        .chat-bubble-user { background: #3b82f6; color: white; border-radius: 20px 20px 4px 20px; }
        .chat-bubble-ai { background: #1f2937; border-radius: 20px 20px 20px 4px; }
        .message { max-width: 80%; animation: fadeIn 0.3s ease; }

        /* HOKUSAI WAVE - MUCH MORE VISIBLE */
        #wave-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.85;                    /* always visible */
            overflow: hidden;
            transition: all 0.6s ease;
        }
        #wave-bg svg { animation: waveDrift 12s linear infinite; }
        @keyframes waveDrift { 0% { transform: translateX(0); } 100% { transform: translateX(-280px); } }

        /* NIGHT MODE - deep dark blue */
        #wave-bg.night svg path:nth-child(1) { stroke: #0f172a !important; }
        #wave-bg.night svg path:nth-child(2) { stroke: #1e40af !important; }
        #wave-bg.night svg path:nth-child(3) { stroke: #60a5fa !important; }

        /* DAY MODE - bright sky blue */
        #wave-bg.day svg path:nth-child(1) { stroke: #0ea5e9 !important; }
        #wave-bg.day svg path:nth-child(2) { stroke: #22d3ee !important; }
        #wave-bg.day svg path:nth-child(3) { stroke: #67e8f9 !important; }

        /* THINKING PHASE - vibrant blue wave (agent effect) */
        #wave-bg.thinking {
            opacity: 0.98 !important;
        }
        #wave-bg.thinking svg path:nth-child(1) { stroke: #0ea5e9 !important; animation-duration: 5s; }
        #wave-bg.thinking svg path:nth-child(2) { stroke: #3b82f6 !important; animation-duration: 6s; }
        #wave-bg.thinking svg path:nth-child(3) { stroke: #60a5fa !important; animation-duration: 4s; }

        /* REFLECTING PHASE - teal wave */
        #wave-bg.reflecting {
            opacity: 0.98 !important;
        }
        #wave-bg.reflecting svg path:nth-child(1) { stroke: #14b8a6 !important; animation-duration: 7s; }
        #wave-bg.reflecting svg path:nth-child(2) { stroke: #22d3ee !important; animation-duration: 8s; }
        #wave-bg.reflecting svg path:nth-child(3) { stroke: #67e8f9 !important; animation-duration: 6s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex h-screen overflow-hidden">

    <!-- HOKUSAI WAVE BACKGROUND -->
    <div id="wave-bg" class="night">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 620 Q360 420 720 580 Q1080 720 1440 540 L1440 900 L0 900 Z" fill="none" stroke="#0f172a" stroke-width="85" stroke-opacity="0.45"/>
            <path d="M0 660 Q300 500 720 640 Q1140 770 1440 590 L1440 900 L0 900 Z" fill="none" stroke="#1e40af" stroke-width="45" stroke-opacity="0.28"/>
            <path d="M180 590 Q260 530 340 580 Q420 520 500 575" fill="none" stroke="#60a5fa" stroke-width="14" stroke-opacity="0.18"/>
        </svg>
    </div>

    <!-- SIDEBAR -->
    <div class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col relative z-10">
        <div class="p-4 border-b border-gray-800 flex items-center gap-3">
            <h1 class="text-2xl font-semibold tracking-tight">ClipperAI</h1>
        </div>
        <div onclick="newSession()" class="mx-4 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3 px-4 flex items-center justify-center gap-2 cursor-pointer transition-colors">
            <i class="fa-solid fa-plus"></i>
            <span class="font-medium">New Conversation</span>
        </div>
