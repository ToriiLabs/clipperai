<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToriiLabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        .chat-bubble-user {
            background: #3b82f6;
            color: white;
            border-radius: 20px 20px 6px 20px;
        }
        
        .chat-bubble-ai {
            background: #374151;
            color: #f3f4f6;
            border-radius: 20px 20px 20px 6px;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-950 text-gray-100">

    <!-- Sidebar -->
    <div class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col">
        <div class="p-5 border-b border-gray-800">
            <h1 class="text-3xl font-semibold tracking-tighter">ToriiLabs</h1>
        </div>

        <div onclick="newSession()" 
             class="mx-4 mt-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3.5 px-4 flex items-center justify-center gap-2 cursor-pointer text-sm font-medium">
            <i class="fa-solid fa-plus"></i>
            <span>New Conversation</span>
        </div>

        <div class="px-5 pt-6 text-xs uppercase tracking-widest text-gray-400">Conversations</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-4 space-y-1 text-sm"></div>

        <div class="px-5 pt-4 text-xs uppercase tracking-widest text-gray-400">Memory</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-2 text-sm"></div>

        <div class="p-4 border-t border-gray-800">
            <button onclick="clearAll()" class="text-xs text-gray-400 hover:text-red-400 flex items-center gap-2">
                <i class="fa-solid fa-trash-can"></i>
                <span>Clear All</span>
            </button>
        </div>
    </div>

    <!-- Main Chat -->
    <div class="flex-1 flex flex-col">
        <div class="h-14 border-b border-gray-800 flex items-center px-6 justify-between bg-gray-900">
            <span id="session-title" class="font-semibold text-lg">New Conversation</span>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-950"></div>

        <div class="p-5 border-t border-gray-800 bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Type your message..."
                       class="flex-1 bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 text-white outline-none">
                <button onclick="sendMessage()" 
                        class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} message`;
            div.innerHTML = `
                <div class="${type === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'} px-5 py-3.5 max-w-[80%]">
                    ${text}
                </div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            // Create AI message bubble
            const aiDiv = addMessage('<span class="text-gray-400">Thinking...</span>', 'ai');

            try {
                const response = await fetch('/api/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) throw new Error('Server error');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let finalText = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || ''; // Keep incomplete line in buffer

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6).trim();
                            if (!jsonStr) continue;

                            try {
                                const data = JSON.parse(jsonStr);

                                if (data.phase) {
                                    // You can show different text based on phase if you want
                                    if (data.phase === 'thinking') {
                                        aiDiv.innerHTML = `<div class="chat-bubble-ai px-5 py-3.5">Thinking...</div>`;
                                    } else if (data.phase === 'reflecting') {
                                        aiDiv.innerHTML = `<div class="chat-bubble-ai px-5 py-3.5">Reflecting...</div>`;
                                    } else if (data.phase === 'final') {
                                        aiDiv.innerHTML = `<div class="chat-bubble-ai px-5 py-3.5"><span class="prose text-gray-100"></span></div>`;
                                    }
                                } 
                                else if (data.token) {
                                    finalText += data.token;
                                    const content = aiDiv.querySelector('.prose') || aiDiv;
                                    content.innerHTML = finalText;
                                    chat.scrollTop = chat.scrollHeight;
                                }
                            } catch (e) {
                                console.error('JSON parse error:', jsonStr);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error(error);
                aiDiv.innerHTML = `<div class="text-red-400 px-4 py-2">Error: Could not connect to model</div>`;
            }
        }

        function newSession() { location.reload(); }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
