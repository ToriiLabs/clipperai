<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toriilabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }

        .chat-bubble-user {
            background: #3b82f6;
            color: white;
            border-radius: 20px 20px 4px 20px;
        }
        .chat-bubble-ai {
            background: #1f2937;
            color: #e5e7eb;
            border-radius: 20px 20px 20px 4px;
        }

        .message {
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        /* === ULTRA-CLEAN HOKUSAI ORBITING WAVE AGENTS (Grok-style, ZERO ghosting) === */
        .orbit-container {
            width: 190px;
            height: 190px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        @media (max-width: 640px) {
            .orbit-container { width: 150px; height: 150px; }
        }

        .center-core {
            width: 72px;
            height: 72px;
            background: radial-gradient(circle at 40% 40%, #ffffff, #00d4ff, #0a4d8f);
            border-radius: 50%;
            box-shadow: 0 0 40px #00ffff, 0 0 80px rgba(255, 0, 170, 0.6), inset 0 0 25px rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            position: relative;
        }
        .center-core svg { width: 44px; height: 44px; }

        .wave-agent {
            position: absolute;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 6px 12px currentColor);
            animation: waveOrbit linear infinite;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }
        .wave-agent svg {
            width: 100%;
            height: 100%;
            animation: agentWave 3.8s ease-in-out infinite;
        }

        /* 8 agents – slower, smoother, more visible waves */
        .agent-1 { --radius: 84px; animation-duration: 14.5s; color: #00f8ff; }
        .agent-2 { --radius: 89px; animation-duration: 18s; color: #ff00cc; }
        .agent-3 { --radius: 80px; animation-duration: 11.5s; color: #aaff44; }
        .agent-4 { --radius: 93px; animation-duration: 16.5s; color: #ffaa33; }
        .agent-5 { --radius: 82px; animation-duration: 13.5s; color: #00ffcc; }
        .agent-6 { --radius: 90px; animation-duration: 19.5s; color: #cc88ff; }
        .agent-7 { --radius: 85px; animation-duration: 12.8s; color: #ff4488; }
        .agent-8 { --radius: 87px; animation-duration: 17.5s; color: #44ddff; }

        @keyframes waveOrbit {
            from   { transform: translate3d(0,0,0) rotate(0deg)   translateX(var(--radius)) rotate(0deg)   translateY(0); }
            25%    { transform: translate3d(0,0,0) rotate(90deg)  translateX(var(--radius)) rotate(-90deg)  translateY(-12px); }
            50%    { transform: translate3d(0,0,0) rotate(180deg) translateX(var(--radius)) rotate(-180deg) translateY(0); }
            75%    { transform: translate3d(0,0,0) rotate(270deg) translateX(var(--radius)) rotate(-270deg) translateY(12px); }
            to     { transform: translate3d(0,0,0) rotate(360deg) translateX(var(--radius)) rotate(-360deg) translateY(0); }
        }

        @keyframes agentWave {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50%      { transform: rotate(18deg) scale(1.09); }
        }

        .thinking-text {
            margin-top: 18px;
            font-size: clamp(15px, 3.5vw, 18px);
            font-weight: 500;
            letter-spacing: 1.8px;
            color: #00e0ff;
            text-shadow: 0 0 18px rgba(0, 224, 255, 0.9);
            animation: pulseText 2.6s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.8; }
            50%      { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .dark #chat::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <div class="w-80 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col relative z-10">
        <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex items-center gap-3">
            <h1 class="text-2xl font-semibold tracking-tight">toriilabs</h1>
        </div>
        <div onclick="newSession()" class="mx-4 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3 px-4 flex items-center justify-center gap-2 cursor-pointer transition-colors">
            <i class="fa-solid fa-plus"></i>
            <span class="font-medium">+ New Conversation</span>
        </div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400 mt-6">CONVERSATIONS</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-2 space-y-1 text-sm"></div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400">MEMORY</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-3 text-sm"></div>
        <div class="p-4 border-t border-gray-200 dark:border-gray-800 text-xs text-gray-500 dark:text-gray-400 flex items-center justify-between">
            <span onclick="clearAll()" class="cursor-pointer hover:text-gray-900 dark:hover:text-white">Clear All</span>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="flex-1 flex flex-col relative z-10">
        <div class="h-14 border-b border-gray-200 dark:border-gray-800 flex items-center px-6 justify-between bg-white dark:bg-gray-900">
            <span id="session-title" class="font-semibold text-lg">New Conversation</span>
            <div class="flex items-center gap-4">
                <button onclick="toggleDayNight()" id="theme-toggle" class="flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-xl transition-colors">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button onclick="clearChat()" class="flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                    <i class="fa-solid fa-trash"></i>
                    <span class="text-sm">Clear</span>
                </button>
            </div>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-8"></div>

        <div class="p-4 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Type your message..."
                       class="flex-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-lg text-gray-900 dark:text-gray-100"
                       onkeydown="if(event.key === 'Enter') sendMessage();">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center text-white transition-colors">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- THINKING SPINNER TEMPLATE (Grok-style orbiting Hokusai waves) -->
    <div id="thinking-template" class="hidden">
        <div class="orbit-container">
            <div class="center-core">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 68 Q35 48 50 70 Q68 45 82 68" fill="none" stroke="#0a4d8f" stroke-width="18" stroke-linecap="round"/>
                    <path d="M25 65 Q40 50 55 71 Q72 48 80 66" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- 8 Hokusai wave agents (highly visible, no ghosting) -->
            <div class="wave-agent agent-1" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M20 68 Q35 48 50 70 Q68 45 82 68" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round"/><circle cx="50" cy="47" r="13" fill="#111"/><circle cx="45" cy="44" r="3.5" fill="#fff"/><circle cx="56" cy="44" r="3.5" fill="#fff"/><path d="M43 57 Q50 62 58 56" fill="none" stroke="#fff" stroke-width="2.5"/></svg></div>
            <div class="wave-agent agent-2" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M18 72 Q37 42 53 69 Q71 47 80 71" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/><circle cx="50" cy="48" r="12" fill="#111"/><circle cx="44" cy="45" r="3" fill="#fff"/><circle cx="56" cy="45" r="3" fill="#fff"/><circle cx="51" cy="56" r="4" fill="#ff3366"/></svg></div>
            <div class="wave-agent agent-3" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M22 65 Q40 50 54 71 Q70 48 79 66" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round"/><circle cx="50" cy="49" r="12" fill="#111"/><circle cx="45" cy="46" r="3" fill="#fff"/><circle cx="55" cy="46" r="3" fill="#fff"/><path d="M44 57 Q50 53 57 57" fill="none" stroke="#ffdd44" stroke-width="3"/></svg></div>
            <div class="wave-agent agent-4" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M19 70 Q36 45 52 68 Q69 50 81 69" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/><circle cx="50" cy="47" r="13" fill="#111"/><circle cx="45" cy="44" r="3.5" fill="#fff"/><circle cx="56" cy="44" r="3.5" fill="#fff"/><path d="M42 56 Q50 61 57 55" fill="none" stroke="#fff" stroke-width="2"/></svg></div>
            <div class="wave-agent agent-5" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M21 67 Q39 47 53 70 Q72 44 80 68" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round"/><circle cx="50" cy="48" r="12" fill="#111"/><circle cx="44" cy="45" r="3" fill="#fff"/><circle cx="56" cy="45" r="3" fill="#fff"/></svg></div>
            <div class="wave-agent agent-6" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M20 71 Q34 50 51 69 Q67 46 83 70" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/><circle cx="50" cy="47" r="13" fill="#111"/><circle cx="45" cy="44" r="3.5" fill="#fff"/><circle cx="56" cy="44" r="3.5" fill="#fff"/><circle cx="50" cy="56" r="3.5" fill="#ff88cc"/></svg></div>
            <div class="wave-agent agent-7" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M23 66 Q38 48 54 70 Q71 45 79 67" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round"/><circle cx="50" cy="49" r="12" fill="#111"/><circle cx="45" cy="46" r="3" fill="#fff"/><circle cx="55" cy="46" r="3" fill="#fff"/></svg></div>
            <div class="wave-agent agent-8" style="top:50%; left:50%; transform:translate(-50%,-50%);"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M18 69 Q35 46 50 71 Q66 49 82 68" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/><circle cx="50" cy="47" r="13" fill="#111"/><circle cx="45" cy="44" r="3.5" fill="#fff"/><circle cx="55" cy="44" r="3.5" fill="#fff"/></svg></div>
        </div>
        <div class="thinking-text">🌊 Torii is thinking... 🌊</div>
    </div>

    <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    let currentAiDiv = null;
    let currentBubble = null;

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} message`;
        div.innerHTML = `<div class="${type === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'} px-5 py-4 w-full"></div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function renderStreaming(text) {
        return text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`(.+?)`/g, '<code class="bg-gray-800 px-1.5 rounded">$1</code>');
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';

        currentAiDiv = addMessage('', 'ai');
        currentBubble = currentAiDiv.querySelector('.chat-bubble-ai');

        const template = document.getElementById('thinking-template').cloneNode(true);
        template.classList.remove('hidden');
        currentBubble.innerHTML = '';
        currentBubble.appendChild(template);

        try {
            const response = await fetch('/api/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            if (!response.ok) throw new Error('Server error');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            let isStreaming = false;

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const dataStr = line.slice(6).trim();
                    if (!dataStr) continue;

                    const data = JSON.parse(dataStr);

                    if (data.token) {
                        if (!isStreaming) {
                            isStreaming = true;
                            currentBubble.innerHTML = `<div class="chat-bubble-ai px-5 py-4">${renderStreaming(fullText)}</div>`;
                        }
                        fullText += data.token;
                        currentBubble.innerHTML = `<div class="chat-bubble-ai px-5 py-4">${renderStreaming(fullText)}</div>`;
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            }
        } catch (error) {
            if (currentBubble) currentBubble.innerHTML = `<div class="chat-bubble-ai px-5 py-4 text-red-400">❌ ${error.message}</div>`;
        }
    }

    function toggleDayNight() {
        const html = document.documentElement;
        const isNight = html.classList.contains('dark');
        if (isNight) {
            html.classList.remove('dark');
            document.getElementById('theme-toggle').querySelector('i').classList.replace('fa-sun', 'fa-moon');
        } else {
            html.classList.add('dark');
            document.getElementById('theme-toggle').querySelector('i').classList.replace('fa-moon', 'fa-sun');
        }
    }

    function newSession() { location.reload(); }
    function clearChat() { chat.innerHTML = ''; }

    async function clearAll() {
        if (!confirm('Clear ALL conversations and memory?')) return;
        await fetch('/api/clear', { method: 'POST' });
        chat.innerHTML = '';
        loadSidebar();
    }

    async function loadSidebar() {
        try {
            const histRes = await fetch('/api/history');
            const hist = await histRes.json();
            const historyHTML = (hist.sessions && hist.sessions.length)
                ? hist.sessions.map(s => `<div class="px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl cursor-pointer text-sm">${s}</div>`).join('')
                : '<div class="px-4 py-2 text-gray-500 dark:text-gray-400 text-sm">No conversations yet</div>';
            document.getElementById('history-list').innerHTML = historyHTML;

            const clipsRes = await fetch('/api/clips');
            const clipsData = await clipsRes.json();
            const clipsHTML = (clipsData.clips && clipsData.clips.length)
                ? clipsData.clips.map(c => `<div class="bg-gray-100 dark:bg-gray-800 p-3 rounded-2xl text-sm">${c}</div>`).join('')
                : '<div class="px-4 py-2 text-gray-500 dark:text-gray-400 text-sm">Memory empty</div>';
            document.getElementById('clips-list').innerHTML = clipsHTML;
        } catch (e) {}
    }

    window.onload = () => {
        loadSidebar();
        console.log('🌊 toriilabs — Grok-style async streaming + fixed Hokusai orbiting waves ready');
    };
    </script>
</body>
</html>
