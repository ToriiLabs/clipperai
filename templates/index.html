<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }

        .chat-bubble-user { background: #3b82f6; color: white; border-radius: 20px 20px 4px 20px; }
        .chat-bubble-ai { background: #1f2937; border-radius: 20px 20px 20px 4px; }

        .message { max-width: 80%; animation: fadeIn 0.3s ease; }

        body { background-color: #f8f9fa; }
        .dark body { background-color: #0f172a; }

        #wave-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.08;
            overflow: hidden;
        }

        /* GROK-STYLE THINKING ANIMATION */
        .thinking-container {
            text-align: center;
            padding: 24px 0;
        }
        .agents-thinking {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #3b82f6;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 150ms; background: #22d3ee; }
        .dot:nth-child(3) { animation-delay: 300ms; background: #a5f3fc; }
        .dot:nth-child(4) { animation-delay: 450ms; background: #3b82f6; }
        .dot:nth-child(5) { animation-delay: 600ms; background: #22d3ee; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.4); opacity: 0.4; }
            50% { transform: scale(1); opacity: 1; }
        }

        .thinking-text {
            font-weight: 600;
            font-size: 0.95rem;
            color: #3b82f6;
        }
        .dark .thinking-text { color: #60a5fa; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- HOKUSAI WAVE -->
    <div id="wave-bg" class="night">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 620 Q360 420 720 580 Q1080 720 1440 540 L1440 900 L0 900 Z" fill="none" stroke="#0f172a" stroke-width="120" stroke-opacity="0.6"/>
            <path d="M0 660 Q300 500 720 640 Q1140 770 1440 590 L1440 900 L0 900 Z" fill="none" stroke="#1e40af" stroke-width="70" stroke-opacity="0.5"/>
            <path d="M180 590 Q260 530 340 580 Q420 520 500 575" fill="none" stroke="#60a5fa" stroke-width="25" stroke-opacity="0.8"/>
        </svg>
    </div>

    <!-- SIDEBAR -->
    <div class="w-80 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col relative z-10">
        <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex items-center gap-3">
            <h1 class="text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">ClipperAI</h1>
        </div>
        <div onclick="newSession()" class="mx-4 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3 px-4 flex items-center justify-center gap-2 cursor-pointer transition-colors">
            <i class="fa-solid fa-plus"></i>
            <span class="font-medium">New Conversation</span>
        </div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400 mt-6">Conversations</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-2 space-y-1 text-sm"></div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400">Memory</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-3 text-sm"></div>
        <div class="p-4 border-t border-gray-200 dark:border-gray-800 text-xs text-gray-500 flex items-center justify-between">
            <span onclick="clearAll()" class="cursor-pointer hover:text-gray-700 dark:hover:text-white">Clear All</span>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="flex-1 flex flex-col relative z-10">
        <div class="h-14 border-b border-gray-200 dark:border-gray-800 flex items-center px-6 justify-between bg-white dark:bg-gray-900">
            <span id="session-title" class="font-semibold text-lg text-gray-900 dark:text-white">New Conversation</span>
            <button onclick="toggleDayNight()" class="flex items-center gap-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white text-xl">
                <i class="fa-solid fa-sun"></i>
            </button>
            <button onclick="clearChat()" class="flex items-center gap-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white">
                <i class="fa-solid fa-trash"></i>
                <span class="text-sm">Clear</span>
            </button>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-8 bg-white dark:bg-gray-950"></div>

        <div class="p-4 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Type your message..." 
                       class="flex-1 bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 focus
