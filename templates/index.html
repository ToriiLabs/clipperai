<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToriiLabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        
        body { font-family: 'Inter', system-ui, sans-serif; }

        .chat-bubble-user {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            border-radius: 20px 20px 6px 20px;
        }
        
        .chat-bubble-ai {
            background: #374151;           /* Slightly lighter for better contrast */
            color: #f3f4f6;                /* Light gray text */
            border-radius: 20px 20px 20px 6px;
        }

        .message {
            max-width: 82%;
            animation: messageSlide 0.25s ease-out;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #wave-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.07;
        }

        .thinking-text {
            font-weight: 600;
            font-size: 0.93rem;
            color: #60a5fa;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-950 text-gray-100">
    
    <!-- Wave Background -->
    <div id="wave-bg">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="none">
            <path id="wave1" d="M0 620 Q360 420 720 580 Q1080 720 1440 540 L1440 900 L0 900 Z" 
                  fill="none" stroke="#334155" stroke-width="120" stroke-opacity="0.5"/>
            <path id="wave2" d="M0 655 Q300 495 720 635 Q1140 765 1440 585 L1440 900 L0 900 Z" 
                  fill="none" stroke="#1e40af" stroke-width="70" stroke-opacity="0.4"/>
            <path id="wave3" d="M160 585 Q250 525 335 575 Q425 515 510 570" 
                  fill="none" stroke="#60a5fa" stroke-width="24" stroke-opacity="0.6"/>
        </svg>
    </div>

    <!-- Sidebar -->
    <div class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col">
        <div class="p-5 border-b border-gray-800">
            <h1 class="text-3xl font-semibold tracking-tighter">ToriiLabs</h1>
        </div>

        <div onclick="newSession()" 
             class="mx-4 mt-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3.5 px-4 flex items-center justify-center gap-2 cursor-pointer text-sm font-medium">
            <i class="fa-solid fa-plus"></i>
            <span>New Conversation</span>
        </div>

        <div class="px-5 pt-6 text-xs uppercase tracking-widest text-gray-400">Conversations</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-4 space-y-1 text-sm"></div>

        <div class="px-5 pt-4 text-xs uppercase tracking-widest text-gray-400">Memory</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-2 text-sm"></div>

        <div class="p-4 border-t border-gray-800">
            <button onclick="clearAll()" class="text-xs text-gray-400 hover:text-red-400 flex items-center gap-2">
                <i class="fa-solid fa-trash-can"></i>
                <span>Clear All</span>
            </button>
        </div>
    </div>

    <!-- Main Chat -->
    <div class="flex-1 flex flex-col">
        <div class="h-14 border-b border-gray-800 flex items-center px-6 justify-between bg-gray-900">
            <span id="session-title" class="font-semibold text-lg">New Conversation</span>
            <button onclick="toggleDayNight()" class="text-gray-400 hover:text-white">
                <i class="fa-solid fa-moon text-lg"></i>
            </button>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-950"></div>

        <div class="p-5 border-t border-gray-800 bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Type your message..."
                       class="flex-1 bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 text-white outline-none">
                <button onclick="sendMessage()" 
                        class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} message`;
            
            if (type === 'user') {
                div.innerHTML = `<div class="chat-bubble-user px-5 py-3.5 max-w-[75%]">${text}</div>`;
            } else {
                div.innerHTML = `
                    <div class="chat-bubble-ai px-5 py-3.5 max-w-[82%]">
                        <div class="prose prose-sm max-w-none text-gray-100">${text}</div>
                    </div>`;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            const aiDiv = addMessage('<span class="text-gray-400">Thinking...</span>', 'ai');

            try {
                const response = await fetch('/api/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let finalText = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    finalText += chunk;

                    const contentDiv = aiDiv.querySelector('.prose');
                    if (contentDiv) contentDiv.innerHTML = finalText;
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (err) {
                aiDiv.innerHTML = `<div class="text-red-400 px-4 py-2">Error connecting to model</div>`;
            }
        }

        function toggleDayNight() {
            document.documentElement.classList.toggle('dark');
        }

        function newSession() { location.reload(); }
        function clearChat() { chat.innerHTML = ''; }
        
        async function clearAll() {
            if (confirm('Clear everything?')) {
                await fetch('/api/clear', { method: 'POST' });
                chat.innerHTML = '';
            }
        }

        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
