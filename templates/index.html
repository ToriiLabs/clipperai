<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI</title>
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #0f0f0f; 
            color: #fff; 
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            max-height: 110px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        h1 { 
            text-align: center; 
            margin-bottom: 10px; 
        }
        #chat { 
            height: 70vh; 
            overflow-y: auto; 
            border: 1px solid #333; 
            padding: 15px; 
            background: #1a1a1a; 
            border-radius: 12px; 
            margin-bottom: 15px; 
        }
        .message { 
            margin: 12px 0; 
            padding: 14px; 
            border-radius: 12px; 
            max-width: 85%; 
        }
        .user { background: #0d6efd; margin-left: auto; text-align: right; }
        .ai { background: #333; }
        input { 
            width: 70%; 
            padding: 14px; 
            border-radius: 8px; 
            border: none; 
            background: #222; 
            color: white; 
        }
        button { 
            padding: 14px 24px; 
            background: #0d6efd; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="/static/images/Code%20Clipper%20Logo-01.jpg" 
             alt="Code Clipper Logo" 
             class="logo">
    </div>

    <h1>ClipperAI — Personal Brainstorming Agent</h1>
    
    <div style="margin-bottom: 15px;">
        <input type="file" id="fileInput" accept=".pdf,.txt,.jpg,.jpeg,.png">
        <button onclick="uploadFile()">Upload Document</button>
    </div>

    <div id="chat"></div>
    
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        function addMessage(text, isUser) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'ai'}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, true);
            input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                addMessage(data.response, false);
            } catch (e) {
                addMessage("❌ Error connecting to server", false);
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file first");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                addMessage(data.message || "File received", false);
                fileInput.value = '';
            } catch (e) {
                addMessage("❌ Upload failed", false);
            }
        }

        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
