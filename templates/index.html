<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI • Brainstorm Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .chat-bubble-user { background: #3b82f6; color: white; border-radius: 20px 20px 4px 20px; }
        .chat-bubble-ai { background: #1f2937; border-radius: 20px 20px 20px 4px; }
        .message { max-width: 80%; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <div class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col">
        <div class="p-4 border-b border-gray-800 flex items-center gap-3">
            <i class="fa-solid fa-brain text-blue-500 text-2xl"></i>
            <h1 class="text-2xl font-semibold">ClipperAI</h1>
        </div>
        
        <!-- New Brainstorm -->
        <div onclick="newSession()" class="mx-4 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3 px-4 flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-plus"></i>
            <span class="font-medium">New Brainstorm Session</span>
        </div>

        <!-- History -->
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-400 mt-6">Recent Sessions</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-2 space-y-1">
            <!-- Populated by JS -->
        </div>

        <!-- Clips / Memory -->
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-400">Clips &amp; Memory</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-3 text-sm">
            <!-- Your existing clips will load here via JS API -->
        </div>

        <div class="p-4 border-t border-gray-800 text-xs text-gray-500">
            32-core CPU • Local • Private
        </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="flex-1 flex flex-col">
        <!-- Header -->
        <div class="h-14 border-b border-gray-800 flex items-center px-6 justify-between">
            <div class="flex items-center gap-3">
                <span id="session-title" class="font-semibold">Untitled Brainstorm</span>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <button onclick="clearChat()" class="flex items-center gap-1 text-gray-400 hover:text-white">
                    <i class="fa-solid fa-trash"></i> Clear
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-8 bg-gray-950">
            <!-- Messages inserted here by JS -->
        </div>

        <!-- Input -->
        <div class="p-4 border-t border-gray-800 bg-gray-900">
            <form id="chat-form" class="flex gap-3">
                <input 
                    id="user-input"
                    type="text"
                    placeholder="Describe your idea or ask the agent..."
                    class="flex-1 bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-lg">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
