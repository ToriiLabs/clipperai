<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToriiLabs • ClipperAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body { font-family: 'Inter', system-ui, sans-serif; }

        .chat-bubble-user {
            background: #3b82f6;
            color: white;
            border-radius: 20px 20px 6px 20px;
        }
        
        .chat-bubble-ai {
            background: #374151;
            color: #f3f4f6;
            border-radius: 20px 20px 20px 6px;
        }

        /* === 24px MULTIPLE PASTEL ORBS (unchanged - you like them) === */
        .thinking-container {
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .multi-orbs {
            display: flex;
            gap: 12px;
        }

        .thinking-orb {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb-core {
            width: 9px;
            height: 9px;
            border-radius: 9999px;
            animation: orbPulse 1.8s ease-in-out infinite;
        }

        .orb-ring {
            position: absolute;
            border: 2px solid;
            border-radius: 9999px;
            animation: ringExpand 2.2s ease-out infinite;
            opacity: 0.65;
        }

        .orb-1 .orb-core { background: #3b82f6; }
        .orb-1 .orb-ring { border-color: #3b82f6; }
        .orb-2 .orb-core { background: #22d3ee; }
        .orb-2 .orb-ring { border-color: #22d3ee; }
        .orb-3 .orb-core { background: #14b8a6; }
        .orb-3 .orb-ring { border-color: #14b8a6; }

        .thinking-orb:nth-child(1) .orb-ring { animation-delay: 0s; }
        .thinking-orb:nth-child(1) .orb-ring:nth-child(2) { animation-delay: 0.35s; }
        .thinking-orb:nth-child(1) .orb-ring:nth-child(3) { animation-delay: 0.7s; }
        .thinking-orb:nth-child(2) .orb-ring { animation-delay: 0.15s; }
        .thinking-orb:nth-child(2) .orb-ring:nth-child(2) { animation-delay: 0.5s; }
        .thinking-orb:nth-child(2) .orb-ring:nth-child(3) { animation-delay: 0.85s; }
        .thinking-orb:nth-child(3) .orb-ring { animation-delay: 0.3s; }
        .thinking-orb:nth-child(3) .orb-ring:nth-child(2) { animation-delay: 0.65s; }
        .thinking-orb:nth-child(3) .orb-ring:nth-child(3) { animation-delay: 1.0s; }

        @keyframes orbPulse { 0%, 100% { transform: scale(0.85); } 50% { transform: scale(1.25); } }
        @keyframes ringExpand { 0% { transform: scale(0.3); opacity: 0.8; } 100% { transform: scale(2.6); opacity: 0; } }

        .thinking-text { font-size: 0.82rem; color: #60a5fa; font-weight: 500; }

        /* === BULLETPROOF TEXT FIX - THIS IS THE IMPORTANT PART === */
        .ai-text {
            white-space: pre-wrap !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            line-height: 1.65;
            display: block;
            width: 100%;
        }

        /* Upload zone */
        .upload-zone {
            border: 2px dashed #64748b;
            transition: all 0.3s;
        }
        .upload-zone:hover { border-color: #3b82f6; background: #1e2937; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-950 text-gray-100">

    <!-- Sidebar (unchanged) -->
    <div class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col">
        <div class="p-5 border-b border-gray-800">
            <h1 class="text-3xl font-semibold tracking-tighter">ToriiLabs</h1>
            <p class="text-xs text-emerald-400">ClipperAI • Vector RAG Ready</p>
        </div>

        <div onclick="newSession()" class="mx-4 mt-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3.5 px-4 flex items-center justify-center gap-2 cursor-pointer text-sm font-medium">
            <i class="fa-solid fa-plus"></i><span>New Conversation</span>
        </div>

        <div class="px-5 pt-6 text-xs uppercase tracking-widest text-gray-400">Conversations</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-4 space-y-1 text-sm"></div>

        <div class="px-5 pt-4 text-xs uppercase tracking-widest text-gray-400">Memory + Documents</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-2 text-sm"></div>

        <div class="px-5 py-4">
            <div id="upload-zone" class="upload-zone rounded-xl p-6 text-center cursor-pointer">
                <p class="text-lg mb-2">📄 Drop PDF • Word • TXT • MD</p>
                <p class="text-xs text-gray-400 mb-3">Files go straight into the vector database</p>
                <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" class="hidden">
                <button onclick="document.getElementById('fileInput').click()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm">📂 Select file</button>
                <div class="text-[10px] mt-3 text-gray-500">or drag & drop here</div>
            </div>
        </div>

        <div class="p-4 border-t border-gray-800">
            <button onclick="clearAll()" class="text-xs text-gray-400 hover:text-red-400 flex items-center gap-2">
                <i class="fa-solid fa-trash-can"></i><span>Clear All (Chat + Vector DB)</span>
            </button>
        </div>
    </div>

    <!-- Main Chat -->
    <div class="flex-1 flex flex-col">
        <div class="h-14 border-b border-gray-800 flex items-center px-6 justify-between bg-gray-900">
            <span id="session-title" class="font-semibold text-lg">New Conversation • Vector RAG Active</span>
            <button onclick="loadSidebar()" class="text-xs px-3 py-1 bg-gray-800 rounded">↻ Refresh Clips</button>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-950"></div>

        <div class="p-5 border-t border-gray-800 bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Ask anything — your documents are now in memory..."
                       class="flex-1 bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 text-white outline-none">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} message`;
            div.innerHTML = `<div class="${type === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'} px-5 py-3.5 max-w-[80%]"></div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div.querySelector('div');
        }

        function showThinkingAnimation(aiDiv, phase) {
            if (phase === 'thinking' || phase === 'reflecting') {
                const isReflect = phase === 'reflecting';
                aiDiv.innerHTML = `
                    <div class="thinking-container ${isReflect ? 'reflecting' : ''}">
                        <div class="multi-orbs">
                            <div class="thinking-orb orb-1"><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-core"></div></div>
                            <div class="thinking-orb orb-2"><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-core"></div></div>
                            <div class="thinking-orb orb-3"><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-ring w-[24px] h-[24px]"></div><div class="orb-core"></div></div>
                        </div>
                        <div class="thinking-text">${isReflect ? 'Reflecting on documents...' : 'Torii Agents thinking'}</div>
                    </div>`;
            } else if (phase === 'final') {
                aiDiv.innerHTML = `<div class="ai-text"></div>`;
            }
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            const aiBubble = addMessage('', 'ai');   // this is the bubble div

            const response = await fetch('/api/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let finalText = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = JSON.parse(line.slice(6).trim());

                    if (data.phase) {
                        showThinkingAnimation(aiBubble, data.phase);
                    } else if (data.token) {
                        finalText += data.token + ' ';
                        const textDiv = aiBubble.querySelector('.ai-text');
                        if (textDiv) textDiv.textContent = finalText;
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            }
        }

        // Rest of functions (upload, sidebar, etc.) unchanged
        function initUpload() { /* ... same as before ... */ }
        async function handleFile(file) { /* ... same as before ... */ }
        async function loadSidebar() { /* ... same as before ... */ }
        function newSession() { chat.innerHTML = ''; document.getElementById('session-title').textContent = 'New Conversation • Vector RAG Active'; }
        async function clearAll() { if (confirm('Clear ALL?')) { await fetch('/api/clear', {method:'POST'}); chat.innerHTML = ''; loadSidebar(); } }

        window.onload = () => {
            initUpload();
            loadSidebar();
            input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
        };
    </script>
</body>
</html>
