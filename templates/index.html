<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body { font-family: 'Inter', system-ui, sans-serif; }

        .chat-bubble-user {
            background: #3b82f6;
            color: white;
            border-radius: 20px 20px 4px 20px;
        }
        .chat-bubble-ai {
            border-radius: 20px 20px 20px 4px;
        }

        .message {
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        /* HOKUSAI WAVE */
        #wave-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.85;
            overflow: hidden;
            transition: all 0.6s ease;
        }
        #wave-bg svg { animation: waveDrift 8s linear infinite; }

        @keyframes waveDrift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-320px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="dark bg-gray-950 text-gray-100 flex h-screen overflow-hidden">

    <!-- HOKUSAI WAVE -->
    <div id="wave-bg" class="night">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 620 Q360 420 720 580 Q1080 720 1440 540 L1440 900 L0 900 Z" fill="none" stroke="#0f172a" stroke-width="120" stroke-opacity="0.6"/>
            <path d="M0 660 Q300 500 720 640 Q1140 770 1440 590 L1440 900 L0 900 Z" fill="none" stroke="#1e40af" stroke-width="70" stroke-opacity="0.5"/>
            <path d="M180 590 Q260 530 340 580 Q420 520 500 575" fill="none" stroke="#60a5fa" stroke-width="25" stroke-opacity="0.8"/>
        </svg>
    </div>

    <!-- SIDEBAR -->
    <div class="w-80 bg-gray-900 dark:bg-gray-900 border-r border-gray-800 flex flex-col relative z-10">
        <div class="p-4 border-b border-gray-800 flex items-center gap-3">
            <h1 class="text-2xl font-semibold tracking-tight">ClipperAI</h1>
        </div>
        <div onclick="newSession()" class="mx-4 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3 px-4 flex items-center justify-center gap-2 cursor-pointer transition-colors">
            <i class="fa-solid fa-plus"></i>
            <span class="font-medium">New Conversation</span>
        </div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-400 mt-6">Conversations</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-2 space-y-1 text-sm"></div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-400">Memory</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-3 text-sm"></div>
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 flex items-center justify-between">
            <span onclick="clearAll()" class="cursor-pointer hover:text-white">Clear All</span>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="flex-1 flex flex-col relative z-10">
        <div class="h-14 border-b border-gray-800 bg-gray-900 flex items-center px-6 justify-between">
            <span id="session-title" class="font-semibold text-lg">New Conversation</span>
            <div class="flex items-center gap-4">
                <button onclick="toggleDayNight()" id="theme-toggle" class="flex items-center gap-2 text-gray-400 hover:text-white text-xl">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button onclick="clearChat()" class="flex items-center gap-2 text-gray-400 hover:text-white">
                    <i class="fa-solid fa-trash"></i>
                    <span class="text-sm">Clear</span>
                </button>
            </div>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-8 bg-gray-950 dark:bg-gray-950"></div>

        <div class="p-4 border-t border-gray-800 bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Type your message..."
                       class="flex-1 bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-lg">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const waveBg = document.getElementById('wave-bg');
    let currentAiDiv = null;

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} message`;
        div.innerHTML = `<div class="${type === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai bg-gray-800 dark:bg-gray-800'} px-5 py-4 prose prose-invert max-w-none">${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function setWavePhase(phase) {
        waveBg.classList.remove('thinking', 'reflecting');
        if (phase) waveBg.classList.add(phase);
    }

    function renderStreaming(text) {
        return text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`(.+?)`/g, '<code class="bg-gray-700 px-1 rounded">$1</code>');
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';

        currentAiDiv = addMessage('<span class="text-gray-400 italic">...</span>', 'ai');

        try {
            const response = await fetch('/api/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            if (!response.ok) throw new Error('Server error');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const dataStr = line.slice(6).trim();
                    if (!dataStr) continue;

                    try {
                        const data = JSON.parse(dataStr);

                        if (data.phase) {
                            setWavePhase(data.phase);
                            const bubble = currentAiDiv.querySelector('div');
                            if (data.phase === 'thinking') bubble.innerHTML = '<span class="text-gray-400 italic">thinking...</span>';
                            else if (data.phase === 'reflecting') bubble.innerHTML = '<span class="text-gray-400 italic">refining...</span>';
                            else if (data.phase === 'final') {
                                setWavePhase(null);
                                bubble.innerHTML = '';
                            }
                        } else if (data.token) {
                            fullText += data.token;
                            const bubble = currentAiDiv.querySelector('div');
                            bubble.innerHTML = renderStreaming(fullText);
                            chat.scrollTop = chat.scrollHeight;
                        }
                    } catch (e) {}
                }
            }
        } catch (error) {
            currentAiDiv.querySelector('div').innerHTML = `❌ Error: ${error.message}`;
        }
    }

    // Full Light/Dark Toggle (UI + Waves)
    function toggleDayNight() {
        const html = document.documentElement;
        const isDark = html.classList.contains('dark');

        if (isDark) {
            html.classList.remove('dark');
            waveBg.classList.remove('night');
            waveBg.classList.add('day');
            document.getElementById('theme-toggle').querySelector('i').classList.replace('fa-sun', 'fa-moon');
        } else {
            html.classList.add('dark');
            waveBg.classList.remove('day');
            waveBg.classList.add('night');
            document.getElementById('theme-toggle').querySelector('i').classList.replace('fa-moon', 'fa-sun');
        }
    }

    function newSession() { location.reload(); }
    function clearChat() { chat.innerHTML = ''; }

    async function clearAll() {
        if (!confirm('Clear ALL?')) return;
        await fetch('/api/clear', { method: 'POST' });
        chat.innerHTML = '';
        loadSidebar();
    }

    async function loadSidebar() {
        // ... your sidebar code
    }

    window.onload = () => {
        console.log('🌊 ClipperAI - Full Light/Dark Mode + Waves Ready');
        loadSidebar();
    };
    </script>
</body>
</html>
