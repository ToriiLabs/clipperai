<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }

        .chat-bubble-user {
            background: #3b82f6;
            color: white;
            border-radius: 20px 20px 4px 20px;
        }
        .chat-bubble-ai {
            background: #f1f5f9;
            color: #0f172a;
            border-radius: 20px 20px 20px 4px;
        }
        .dark .chat-bubble-ai {
            background: #1f2937;
            color: #e5e7eb;
        }

        .message {
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        /* === GROK-STYLE HOKUSAI WAVES (now visible + dynamic) === */
        #wave-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.92;
            overflow: hidden;
            transition: all 0.6s ease;
        }
        #wave-bg svg {
            animation: waveDrift 6.5s linear infinite;
        }

        @keyframes waveDrift {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(-340px) rotate(4deg); }
        }

        /* Flowing "spinning" highlight wave */
        #wave-highlight {
            stroke-dasharray: 50 25;
            animation: wave-flow 2.8s linear infinite;
        }

        @keyframes wave-flow {
            to { stroke-dashoffset: -75; }
        }

        /* Strong pulse + faster flow when AI is thinking/reflecting */
        #wave-bg.thinking svg,
        #wave-bg.reflecting svg {
            animation: waveDrift 3.2s linear infinite, wavePulse 1.8s ease-in-out infinite;
        }
        #wave-bg.thinking #wave-highlight,
        #wave-bg.reflecting #wave-highlight {
            animation: wave-flow 1.4s linear infinite;
        }

        @keyframes wavePulse {
            0%, 100% { opacity: 0.88; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.09); }
        }

        /* Night (dark theme) - deep layered blues */
        #wave-bg.night svg path:nth-child(1) { stroke: #1e3a5f !important; }
        #wave-bg.night svg path:nth-child(2) { stroke: #3b6b9a !important; }
        #wave-bg.night svg path:nth-child(3) { stroke: #0ea5e9 !important; }

        /* Day (light theme) - visible but softer */
        #wave-bg.day svg path:nth-child(1) { stroke: #64748b !important; }
        #wave-bg.day svg path:nth-child(2) { stroke: #94a3b8 !important; }
        #wave-bg.day svg path:nth-child(3) { stroke: #38bdf8 !important; }

        /* Thinking/Reflecting - vibrant pop regardless of theme */
        #wave-bg.thinking svg path:nth-child(1) { stroke: #0e7490 !important; }
        #wave-bg.thinking svg path:nth-child(2) { stroke: #06b6d4 !important; }
        #wave-bg.thinking svg path:nth-child(3) { stroke: #67e8f9 !important; }

        #wave-bg.reflecting svg path:nth-child(1) { stroke: #0f766e !important; }
        #wave-bg.reflecting svg path:nth-child(2) { stroke: #14b8a6 !important; }
        #wave-bg.reflecting svg path:nth-child(3) { stroke: #5eead4 !important; }

        .thinking-dots::after {
            content: '...';
            animation: thinkingDots 1.3s infinite steps(3);
        }
        @keyframes thinkingDots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .dark #chat::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex h-screen overflow-hidden">

    <!-- HOKUSAI WAVE BACKGROUND (now visible in chat area) -->
    <div id="wave-bg" class="night">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Layered Hokusai-style waves for depth -->
            <path d="M0 620 Q360 420 720 580 Q1080 720 1440 540 L1440 900 L0 900 Z" fill="none" stroke="#1e3a5f" stroke-width="135" stroke-opacity="0.8"/>
            <path d="M0 660 Q300 500 720 640 Q1140 770 1440 590 L1440 900 L0 900 Z" fill="none" stroke="#3b6b9a" stroke-width="78" stroke-opacity="0.7"/>
            <!-- Highlight wave with flowing animation -->
            <path id="wave-highlight" d="M180 590 Q260 530 340 580 Q420 520 500 575" fill="none" stroke="#0ea5e9" stroke-width="30" stroke-opacity="0.95"/>
        </svg>
    </div>

    <!-- SIDEBAR (solid, matches your screenshot) -->
    <div class="w-80 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col relative z-10">
        <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex items-center gap-3">
            <h1 class="text-2xl font-semibold tracking-tight">ClipperAI</h1>
        </div>
        <div onclick="newSession()" class="mx-4 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3 px-4 flex items-center justify-center gap-2 cursor-pointer transition-colors">
            <i class="fa-solid fa-plus"></i>
            <span class="font-medium">+ New Conversation</span>
        </div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400 mt-6">CONVERSATIONS</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-2 space-y-1 text-sm"></div>
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400">MEMORY</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-3 text-sm"></div>
        <div class="p-4 border-t border-gray-200 dark:border-gray-800 text-xs text-gray-500 dark:text-gray-400 flex items-center justify-between">
            <span onclick="clearAll()" class="cursor-pointer hover:text-gray-900 dark:hover:text-white">Clear All</span>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="flex-1 flex flex-col relative z-10">
        <!-- Header bar (solid) -->
        <div class="h-14 border-b border-gray-200 dark:border-gray-800 flex items-center px-6 justify-between bg-white dark:bg-gray-900">
            <span id="session-title" class="font-semibold text-lg">New Conversation</span>
            <div class="flex items-center gap-4">
                <button onclick="toggleDayNight()" id="theme-toggle" class="flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-xl transition-colors">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button onclick="clearChat()" class="flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                    <i class="fa-solid fa-trash"></i>
                    <span class="text-sm">Clear</span>
                </button>
            </div>
        </div>

        <!-- Chat area (TRANSPARENT so waves show through!) -->
        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-8"></div>

        <!-- Input bar (solid) -->
        <div class="p-4 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Type your message..."
                       class="flex-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-lg text-gray-900 dark:text-gray-100"
                       onkeydown="if(event.key === 'Enter') sendMessage();">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center text-white transition-colors">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const waveBg = document.getElementById('wave-bg');
    let currentAiDiv = null;

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} message`;
        div.innerHTML = `<div class="${type === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'} px-5 py-4">${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function setWavePhase(phase) {
        waveBg.classList.remove('thinking', 'reflecting');
        if (phase === 'thinking' || phase === 'reflecting') {
            waveBg.classList.add(phase);
        }
    }

    function renderStreaming(text) {
        return text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`(.+?)`/g, '<code class="bg-gray-200 dark:bg-gray-800 px-1.5 rounded">$1</code>');
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';

        currentAiDiv = addMessage('<span class="text-gray-400 dark:text-gray-400 italic">thinking<span class="thinking-dots"></span></span>', 'ai');

        try {
            const response = await fetch('/api/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            if (!response.ok) throw new Error('Server error');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;

                    const dataStr = line.slice(6).trim();
                    if (!dataStr) continue;

                    try {
                        const data = JSON.parse(dataStr);

                        if (data.phase) {
                            setWavePhase(data.phase);
                            const bubble = currentAiDiv.querySelector('div');
                            if (data.phase === 'thinking') {
                                bubble.innerHTML = '<span class="text-cyan-500 dark:text-cyan-400 italic">thinking<span class="thinking-dots"></span></span>';
                            } else if (data.phase === 'reflecting') {
                                bubble.innerHTML = '<span class="text-teal-500 dark:text-teal-400 italic">refining<span class="thinking-dots"></span></span>';
                            } else if (data.phase === 'final') {
                                setWavePhase(null);
                                bubble.innerHTML = '';
                            }
                        } 
                        else if (data.token) {
                            fullText += data.token;
                            const bubble = currentAiDiv.querySelector('div');
                            bubble.innerHTML = renderStreaming(fullText);
                            chat.scrollTop = chat.scrollHeight;
                        }
                    } catch (e) {}
                }
            }
        } catch (error) {
            currentAiDiv.querySelector('div').innerHTML = `❌ ${error.message}`;
        }
    }

    function toggleDayNight() {
        const html = document.documentElement;
        const isNight = waveBg.classList.contains('night');

        if (isNight) {
            // Switch to DAY / light
            html.classList.remove('dark');
            waveBg.classList.remove('night');
            waveBg.classList.add('day');
            document.getElementById('theme-toggle').querySelector('i').classList.replace('fa-sun', 'fa-moon');
        } else {
            // Switch to NIGHT / dark
            html.classList.add('dark');
            waveBg.classList.remove('day');
            waveBg.classList.add('night');
            document.getElementById('theme-toggle').querySelector('i').classList.replace('fa-moon', 'fa-sun');
        }
    }

    function newSession() { location.reload(); }
    function clearChat() { chat.innerHTML = ''; }

    async function clearAll() {
        if (!confirm('Clear ALL conversations and memory?')) return;
        await fetch('/api/clear', { method: 'POST' });
        chat.innerHTML = '';
        loadSidebar();
    }

    async function loadSidebar() {
        try {
            const histRes = await fetch('/api/history');
            const hist = await histRes.json();
            const historyHTML = (hist.sessions && hist.sessions.length)
                ? hist.sessions.map(s => `<div class="px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl cursor-pointer text-sm">${s}</div>`).join('')
                : '<div class="px-4 py-2 text-gray-500 dark:text-gray-400 text-sm">No conversations yet</div>';
            document.getElementById('history-list').innerHTML = historyHTML;

            const clipsRes = await fetch('/api/clips');
            const clipsData = await clipsRes.json();
            const clipsHTML = (clipsData.clips && clipsData.clips.length)
                ? clipsData.clips.map(c => `<div class="bg-gray-100 dark:bg-gray-800 p-3 rounded-2xl text-sm">${c}</div>`).join('')
                : '<div class="px-4 py-2 text-gray-500 dark:text-gray-400 text-sm">Memory empty</div>';
            document.getElementById('clips-list').innerHTML = clipsHTML;
        } catch (e) {
            console.error('Sidebar load error:', e);
        }
    }

    window.onload = () => {
        loadSidebar();
        console.log('🌊 ClipperAI ready — waves visible + full theme toggle working');
    };
    </script>
</body>
</html>
