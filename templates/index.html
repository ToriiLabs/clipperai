<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipper AI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="app">
        <img src="/static/images/Code%20Clipper%20Logo-01.jpg" alt="Clipper Logo" />
        
        <div class="chat-box">
            <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
            <button id="send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 7L8.59 8.41 13.17 13H7v2h6.17l-4.59 4.59L10 17l7-7-7-7z"></path>
                </svg>
            </button>
        </div>
        
        <div id="chat"></div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
