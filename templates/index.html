<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body { font-family: 'Inter', system-ui, sans-serif; }

        .chat-bubble-user { background: #3b82f6; color: white; border-radius: 20px 20px 4px 20px; }
        .chat-bubble-ai { background: #1f2937; border-radius: 20px 20px 20px 4px; }

        .message { max-width: 80%; animation: fadeIn 0.3s ease; }

        /* ==================== WAVES ==================== */
        #wave-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.9;
            transition: all 0.6s ease;
        }
        #wave-bg svg { animation: waveDrift 7s linear infinite; }

        @keyframes waveDrift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-350px); }
        }

        /* NIGHT */
        #wave-bg.night svg path:nth-child(1) { stroke: #1e2937 !important; }
        #wave-bg.night svg path:nth-child(2) { stroke: #334155 !important; }
        #wave-bg.night svg path:nth-child(3) { stroke: #60a5fa !important; }

        /* DAY */
        #wave-bg.day svg path:nth-child(1) { stroke: #0ea5e9 !important; }
        #wave-bg.day svg path:nth-child(2) { stroke: #22d3ee !important; }
        #wave-bg.day svg path:nth-child(3) { stroke: #a5f3fc !important; }

        /* THINKING - VERY VISIBLE */
        #wave-bg.thinking {
            opacity: 1 !important;
            filter: brightness(1.4) saturate(2);
        }
        #wave-bg.reflecting {
            opacity: 0.95 !important;
            filter: hue-rotate(200deg) brightness(1.2);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="dark bg-gray-950 text-gray-100 flex h-screen overflow-hidden">

    <!-- WAVES -->
    <div id="wave-bg" class="night">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 620 Q360 420 720 580 Q1080 720 1440 540 L1440 900 L0 900 Z" fill="none" stroke="#0f172a" stroke-width="120" stroke-opacity="0.6"/>
            <path d="M0 660 Q300 500 720 640 Q1140 770 1440 590 L1440 900 L0 900 Z" fill="none" stroke="#1e40af" stroke-width="70" stroke-opacity="0.5"/>
            <path d="M180 590 Q260 530 340 580 Q420 520 500 575" fill="none" stroke="#60a5fa" stroke-width="25" stroke-opacity="0.8"/>
        </svg>
    </div>

    <!-- Rest of your UI (simplified) -->
    <div class="w-80 bg-gray-900 border-r border-gray-700 flex flex-col z-10">
        <div class="p-4 border-b border-gray-700">ClipperAI</div>
        <div class="flex-1 p-4">Sidebar</div>
    </div>

    <div class="flex-1 flex flex-col">
        <div class="h-14 border-b border-gray-700 bg-gray-900 flex items-center px-6 justify-between">
            <span>New Conversation</span>
            <button onclick="toggleDayNight()" id="theme-toggle" class="text-xl">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
        <div id="chat" class="flex-1 p-6 overflow-y-auto"></div>
        <div class="p-4 border-t border-gray-700 bg-gray-900">
            <input id="input" class="w-full bg-gray-800 rounded-2xl px-5 py-4" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendMessage()">
        </div>
    </div>

    <script>
    const waveBg = document.getElementById('wave-bg');
    const chat = document.getElementById('chat');

    function setWavePhase(phase) {
        waveBg.classList.remove('thinking', 'reflecting');
        if (phase) waveBg.classList.add(phase);
        console.log("Wave Phase →", phase);
    }

    function toggleDayNight() {
        const isNight = waveBg.classList.contains('night');
        waveBg.classList.toggle('night', !isNight);
        waveBg.classList.toggle('day', isNight);
        
        const icon = document.getElementById('theme-toggle').querySelector('i');
        icon.classList.toggle('fa-sun', !isNight);
        icon.classList.toggle('fa-moon', isNight);
        
        console.log("Theme toggled →", isNight ? "DAY" : "NIGHT");
    }

    async function sendMessage() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;

        chat.innerHTML += `<div class="flex justify-end"><div class="chat-bubble-user px-5 py-3 mb-4">${msg}</div></div>`;
        input.value = '';

        const aiDiv = document.createElement('div');
        aiDiv.className = "flex justify-start";
        aiDiv.innerHTML = `<div class="chat-bubble-ai px-5 py-3 mb-4"><span class="text-gray-400">thinking...</span></div>`;
        chat.appendChild(aiDiv);
        chat.scrollTop = chat.scrollHeight;

        // Simulate phases for testing
        setTimeout(() => setWavePhase('thinking'), 300);
        setTimeout(() => setWavePhase('reflecting'), 1500);
        setTimeout(() => {
            setWavePhase(null);
            aiDiv.querySelector('div').innerHTML = "Waves should be visible now!";
        }, 3000);
    }

    // Auto test waves on load
    window.onload = () => {
        console.log("✅ ClipperAI Test Mode Loaded");
        setTimeout(() => setWavePhase('thinking'), 800);
    };
    </script>
</body>
</html>
