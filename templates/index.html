<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipperAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        .chat-bubble-user { background: #3b82f6; color: white; border-radius: 20px 20px 4px 20px; }
        .chat-bubble-ai { background: #1f2937; border-radius: 20px 20px 20px 4px; }
        .message { max-width: 80%; animation: fadeIn 0.3s ease; }

        /* HOKUSAI WAVE - always visible base */
        #wave-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.55;
            overflow: hidden;
            transition: all 0.8s ease;
        }
        #wave-bg svg { animation: waveDrift 14s linear infinite; }
        @keyframes waveDrift { 0% { transform: translateX(0); } 100% { transform: translateX(-250px); } }

        /* NIGHT MODE */
        #wave-bg.night svg path:nth-child(1) { stroke: #0f172a; }
        #wave-bg.night svg path:nth-child(2) { stroke: #1e40af; }
        #wave-bg.night svg path:nth-child(3) { stroke: #60a5fa; }

        /* DAY MODE */
        #wave-bg.day svg path:nth-child(1) { stroke: #0ea5e9; }
        #wave-bg.day svg path:nth-child(2) { stroke: #22d3ee; }
        #wave-bg.day svg path:nth-child(3) { stroke: #67e8f9; }

        /* THINKING PHASE - strong blue wave (agent-like) */
        #wave-bg.thinking {
            opacity: 0.95 !important;
        }
        #wave-bg.thinking svg path:nth-child(1) { stroke: #0ea5e9 !important; }
        #wave-bg.thinking svg path:nth-child(2) { stroke: #3b82f6 !important; }
        #wave-bg.thinking svg path:nth-child(3) { stroke: #60a5fa !important; animation-duration: 6s; }

        /* REFLECTING PHASE - teal wave */
        #wave-bg.reflecting {
            opacity: 0.95 !important;
        }
        #wave-bg.reflecting svg path:nth-child(1) { stroke: #14b8a6 !important; }
        #wave-bg.reflecting svg path:nth-child(2) { stroke: #22d3ee !important; }
        #wave-bg.reflecting svg path:nth-child(3) { stroke: #67e8f9 !important; animation-duration: 8s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex h-screen overflow-hidden">

    <!-- HOKUSAI WAVE BACKGROUND -->
    <div id="wave-bg" class="night">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 620 Q360 420 720 580 Q1080 720 1440 540 L1440 900 L0 900 Z" fill="none" stroke="#0f172a" stroke-width="85" stroke-opacity="0.45"/>
            <path d="M0 660 Q300 500 720 640 Q1140 770 1440 590 L1440 900 L0 900 Z" fill="none" stroke="#1e40af" stroke-width="45" stroke-opacity="0.28"/>
            <path d="M180 590 Q260 530 340 580 Q420 520 500 575" fill="none" stroke="#60a5fa" stroke-width="14" stroke-opacity="0.18"/>
        </svg>
    </div>

    <!-- SIDEBAR -->
    <div class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col relative z-10">
        <div class="p-4 border-b border-gray-800 flex items-center gap-3">
            <h1 class="text-2xl font-semibold tracking-tight">ClipperAI</h1>
        </div>
        <div onclick="newSession()" class="mx-4 mt-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl py-3 px-4 flex items-center justify-center gap-2 cursor-pointer transition-colors">
            <i class="fa-solid fa-plus"></i>
            <span class="font-medium">New Conversation</span>
        </div>
        
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-400 mt-6">Conversations</div>
        <div id="history-list" class="flex-1 overflow-y-auto px-2 space-y-1 text-sm"></div>
        
        <div class="px-4 py-2 text-xs uppercase tracking-widest text-gray-400">Memory</div>
        <div id="clips-list" class="flex-1 overflow-y-auto px-4 space-y-3 text-sm"></div>
        
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 flex items-center justify-between">
            <span onclick="clearAll()" class="cursor-pointer hover:text-white">Clear All</span>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="flex-1 flex flex-col relative z-10">
        <div class="h-14 border-b border-gray-800 flex items-center px-6 justify-between bg-gray-900">
            <span id="session-title" class="font-semibold text-lg">New Conversation</span>
            
            <button onclick="toggleDayNight()" id="theme-toggle" class="flex items-center gap-2 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-sun"></i>
            </button>
            
            <button onclick="clearChat()" class="flex items-center gap-2 text-gray-400 hover:text-white">
                <i class="fa-solid fa-trash"></i>
                <span class="text-sm">Clear</span>
            </button>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-8 bg-gray-950"></div>

        <div class="p-4 border-t border-gray-800 bg-gray-900">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Type your message..." 
                       class="flex-1 bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-lg"
                       onkeydown="if(event.key === 'Enter') sendMessage();">
                <button onclick="sendMessage()" 
                        class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const waveBg = document.getElementById('wave-bg');
        const themeToggle = document.getElementById('theme-toggle');

        function autoDetectTheme() {
            const hour = new Date().getHours();
            const isDay = hour >= 6 && hour < 19;
            waveBg.classList.toggle('day', isDay);
            waveBg.classList.toggle('night', !isDay);
            themeToggle.innerHTML = isDay ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
        }

        function toggleDayNight() {
            const isDay = waveBg.classList.contains('day');
            waveBg.classList.toggle('day', !isDay);
            waveBg.classList.toggle('night', isDay);
            themeToggle.innerHTML = isDay ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        function setWavePhase(phase) {
            waveBg.classList.remove('thinking', 'reflecting');
            if (phase === 'thinking' || phase === 'reflecting') {
                waveBg.classList.add(phase);
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} message`;
            div.innerHTML = `<div class="${type === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'} px-5 py-4">${text}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            const aiDiv = addMessage('<span class="text-gray-400">Thinking...</span>', 'ai');

            try {
                const response = await fetch('/api/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));

                            if (data.phase) {
                                setWavePhase(data.phase);

                                if (data.phase === 'thinking') {
                                    aiDiv.querySelector('div').innerHTML = 'Thinking step-by-step...';
                                } else if (data.phase === 'reflecting') {
                                    aiDiv.querySelector('div').innerHTML = 'Reflecting & polishing...';
                                } else if (data.phase === 'final') {
                                    aiDiv.querySelector('div').innerHTML = '';
                                }
                            } 
                            else if (data.token) {
                                // SLOWER streaming - more natural Grok feel
                                aiDiv.querySelector('div').innerHTML += data.token;
                                chat.scrollTop = chat.scrollHeight;
                                await new Promise(resolve => setTimeout(resolve, 12)); // ← slows it down nicely
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Stream error:', error);
                aiDiv.querySelector('div').innerHTML = 'Error connecting to model.';
            }
        }

        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function newSession() { location.reload(); }
        function clearChat() { chat.innerHTML = ''; }
        function clearAll() { 
            if (confirm('Clear all conversations and memory?')) chat.innerHTML = ''; 
        }

        window.onload = autoDetectTheme;
    </script>
</body>
</html>
